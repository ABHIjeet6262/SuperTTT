# Server Configuration
server.port=8080

# Application Name
spring.application.name=SuperTTT

# Database Configuration (MySQL)
spring.datasource.url=jdbc:mysql://localhost:3306/supertictactoe_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# JWT Configuration
app.jwt.secret=SuperTTTSecretKeyForJWTTokenGenerationWhichMustBeAtLeast256BitsLongForHMACSHA256
app.jwt.expiration-ms=86400000

# CORS Allowed Origins
app.cors.allowed-origins=http://localhost:5173,http://localhost:3000
