# Server Configuration
server.port=${PORT:8080}

# Application Name
spring.application.name=SuperTTT

# Database Configuration (MySQL)
# All sensitive values MUST be provided via environment variables — no fallback defaults
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/supertictactoe_db?createDatabaseIfNotExist=true&useSSL=true&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Configuration
# Use 'validate' in production — set via SPRING_JPA_DDL_AUTO env var
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# JWT Configuration — JWT_SECRET MUST be set via environment variable in production
# Minimum 256-bit (32+ character) random string, never committed to source control
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
