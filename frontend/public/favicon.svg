<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0e14"/>
      <stop offset="100%" stop-color="#141923"/>
    </linearGradient>
    <linearGradient id="boltGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="50%" stop-color="#4facfe"/>
      <stop offset="100%" stop-color="#ff2a6d"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Rounded App Icon Background -->
  <rect width="100" height="100" rx="24" fill="url(#bgGrad)" stroke="rgba(0, 242, 254, 0.4)" stroke-width="3"/>

  <!-- Subtle 3x3 Game Grid Lines -->
  <line x1="36" y1="18" x2="36" y2="82" stroke="rgba(255, 255, 255, 0.12)" stroke-width="3" stroke-linecap="round"/>
  <line x1="64" y1="18" x2="64" y2="82" stroke="rgba(255, 255, 255, 0.12)" stroke-width="3" stroke-linecap="round"/>
  <line x1="18" y1="36" x2="82" y2="36" stroke="rgba(255, 255, 255, 0.12)" stroke-width="3" stroke-linecap="round"/>
  <line x1="18" y1="64" x2="82" y2="64" stroke="rgba(255, 255, 255, 0.12)" stroke-width="3" stroke-linecap="round"/>

  <!-- SuperTTT Glowing Lightning Bolt -->
  <path d="M54 14 L26 50 L48 50 L42 86 L74 46 L52 46 Z" 
        fill="url(#boltGrad)" 
        filter="url(#glow)"/>
</svg>